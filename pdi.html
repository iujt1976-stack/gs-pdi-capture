<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GS PDI Capture</title>
<script src="floor-boot.js"></script>
<script src="build.js"></script>
<script src="inspector-code.js"></script>
<script src="unit-rules.js"></script>
<script src="photo-send.js"></script>
<script src="gs-lanes.js"></script>
<script src="lane-data.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  color: #111;
  padding: 12px;
  padding-bottom: 140px;
}
h1 { font-size: 1.2rem; text-align: center; margin-bottom: 10px; }
.home { text-align: center; margin: 0 0 10px; }
.home a { color: #1a5276; font-size: 0.85rem; font-weight: 700; text-decoration: none; }
.sub { text-align: center; font-size: 0.75rem; color: #666; margin-bottom: 12px; }
.card {
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
}
label { display: block; font-size: 0.7rem; font-weight: 700; color: #555; margin-bottom: 2px; text-transform: uppercase; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 1rem;
  margin-bottom: 10px;
}
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.sec {
  font-size: 0.8rem;
  font-weight: 700;
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  margin: 10px 0 6px;
}
.sec-lane { background: #2c3e50; }
.sec-sub { background: #34495e; font-size: 0.8rem; letter-spacing: 0.4px; margin-top: 8px; }
.sec-note { font-size: 0.75rem; color: #444; background: #eef2f5; border-left: 3px solid #34495e; padding: 6px 8px; margin: 0 0 4px; border-radius: 0 4px 4px 0; }
/* r8a: water test result (Rain lane). Explicit colors, readable on a light or a dark phone setting. */
.rr-box { background: #fff; color: #111; border: 2px solid #2c3e50; border-radius: 8px; padding: 10px; margin: 8px 0 10px; }
.rr-box.rr-bad { border-color: #b42318; }
.rr-q { font-size: 0.95rem; font-weight: 800; color: #111; margin-bottom: 6px; text-transform: none; }
.rr-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.rr-opts button, .rr-where button, .rr-prompt button { min-height: 44px; padding: 8px 12px; border: 2px solid #667085; border-radius: 8px; background: #fff; color: #111; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
.rr-opts button[aria-pressed="true"].rr-nl { background: #05603a; border-color: #05603a; color: #fff; }
.rr-opts button[aria-pressed="true"].rr-lk { background: #b42318; border-color: #b42318; color: #fff; }
.rr-opts button[aria-pressed="true"].rr-nt { background: #475467; border-color: #475467; color: #fff; }
.rr-where { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.rr-where button[aria-pressed="true"] { background: #fef0c7; border-color: #b54708; color: #4e2a06; }
.rr-lab { font-size: 0.72rem; font-weight: 700; color: #555; text-transform: uppercase; margin: 6px 0 2px; }
.rr-box textarea { margin-bottom: 4px; min-height: 64px; color: #111; background: #fff; }
.rr-count { font-size: 0.7rem; color: #555; text-align: right; }
.rr-err { color: #b42318; font-weight: 700; font-size: 0.85rem; margin-top: 4px; }
.rr-prompt { background: #fef0c7; color: #4e2a06; border: 2px solid #b54708; border-radius: 8px; padding: 10px; margin-top: 8px; }
.rr-prompt p { font-weight: 800; margin-bottom: 8px; }
.rr-prompt button { margin-right: 6px; }
.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 0.9rem;
}
.item span { flex: 1; }
.pf {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.pf button {
  border: 1px solid #ccc;
  background: #f8f8f8;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 0.7rem;
  font-weight: 700;
  cursor: pointer;
}
.pf button.on-pass { background: #27ae60; color: #fff; border-color: #27ae60; }
.pf button.on-fail { background: #e74c3c; color: #fff; border-color: #e74c3c; }
.pf button.on-na { background: #95a5a6; color: #fff; border-color: #95a5a6; }
.item { flex-wrap: wrap; }
.item-wrap { border-bottom: 1px solid #eee; padding: 6px 0 8px; }
.item-wrap > .item { border-bottom: none; padding: 4px 0; }
.na-pick { width: 100%; margin-top: 4px; font-size: 0.78rem; padding: 4px 6px; display: none; }
.na-pick.on { display: block; }
.fail-inline, .na-inline { display: none; width: 100%; margin-top: 6px; padding: 8px; border-radius: 6px; }
.fail-inline.on, .na-inline.on { display: block; }
.photo-banner { display: none; position: sticky; top: 0; z-index: 50; background: #b3261e; color: #fff; font-size: 14px; }
.photo-banner.on { display: block; }
.photo-banner .pb-head { width: 100%; text-align: left; background: none; border: 0; color: #fff; font-weight: 700; padding: 10px 12px; font-size: 15px; }
.photo-banner .pb-warn { padding: 0 12px 8px; font-weight: 700; }
.photo-banner .pb-list { background: #fff; color: #222; padding: 4px 8px; }
.photo-banner .pb-row { border-bottom: 1px solid #ddd; padding: 8px 4px; }
.photo-banner .pb-row small { display: block; color: #8a1c14; word-break: break-word; }
.photo-banner .pb-row button { margin: 6px 6px 0 0; padding: 6px 12px; }
.val-bad { outline: 3px solid #d93025; outline-offset: 2px; border-radius: 8px; background: rgba(217,48,37,.08); }
.fail-inline { background: #fff5f5; border: 1px solid #f5c6cb; }
.na-inline { background: #f4f6f7; border: 1px solid #d5d8dc; }
.fail-inline label, .na-inline label { font-size: 0.72rem; font-weight: 700; display: block; margin-bottom: 4px; }
.fail-inline textarea { width: 100%; min-height: 52px; font-size: 0.9rem; padding: 6px; border: 1px solid #e6b0aa; border-radius: 4px; }
.defect {
  background: #fff5f5;
  border: 1px solid #f5c6cb;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}
.defect textarea { min-height: 60px; }
.photo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.photo-thumb {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: #eee;
}
.photo-btn {
  background: #3498db;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.photo-clear {
  background: #e74c3c;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 0.7rem;
  cursor: pointer;
}
.actions {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  padding: 12px;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
  display: flex;
  gap: 8px;
  z-index: 50;
  flex-wrap: wrap;
}
.btn {
  flex: 1;
  min-width: 110px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
}
.btn-save { background: #7f8c8d; }
.btn-go { background: #27ae60; }
.btn-fallback { background: #e67e22; }
.btn-add {
  width: 100%;
  padding: 14px;
  background: #2c3e50;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}
.hard {
  background: #c0392b;
  color: #fff;
  text-align: center;
  padding: 12px;
  border-radius: 8px;
  font-weight: 700;
  margin-bottom: 12px;
  display: none;
}
.hard.on { display: block; }
.status { text-align: center; font-size: 0.8rem; color: #666; margin-top: 6px; }
.hidden { display: none; }
.rm {
  background: #e74c3c;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 6px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  margin-top: 6px;
}
.queue-badge {
  background: #e67e22;
  color: #fff;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  text-align: left;
  margin-bottom: 8px;
  white-space: pre-line;
  line-height: 1.35;
  cursor: pointer;
}
.queue-badge.on { display: block; }
.photo-chip {
  background: #1a5276;
  color: #fff;
  font-size: 0.78rem;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: none;
}
.photo-chip.on { display: block; }
.photo-chip.wait { background: #b9770e; }
.photo-chip.err { background: #922b21; }
.photo-thumb.sent { outline: 2px solid #27ae60; }
.queue-actions { display: none; gap: 8px; margin: 0 0 10px; }
.queue-actions.on { display: flex; }
.queue-actions button {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 10px 8px;
  font-weight: 700;
  font-size: 0.82rem;
}

.today-panel { margin-top: 8px; }
.btn-go:disabled, .btn-save:disabled { opacity: 0.55; cursor: wait; }
.def-lab-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.mic-btn {
  background: #8e44ad; color: #fff; border: none; border-radius: 6px;
  padding: 6px 10px; font-size: 0.85rem; cursor: pointer; margin-left: 6px;
}
.mic-btn.listening { background: #c0392b; }

.draft-list { margin-top: 8px; }
.draft-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.85rem;
}
.draft-row button {
  padding: 6px 10px; border: none; border-radius: 6px; font-size: 0.8rem;
  font-weight: 600; cursor: pointer; color: #fff; background: #2c3e50; margin-left: 4px;
}
.draft-row .del { background: #c0392b; }
.btn-reset { background: #7f8c8d !important; }
.hid-extra { display: none !important; }

/* ---- Load Day's Units (r7a): full-screen picker, phone first, light and dark ---- */
.ld{--bg:#F2F4F7;--surface:#FFFFFF;--ink:#101828;--muted:#475467;--line:#EAECF0;--line2:#D0D5DD;--outline:#667085;--red-bg:#FEE4E2;--red:#912018;--blue-bg:#DBEAFE;--blue:#1E40AF;--green-bg:#DCFAE6;--green:#05603A;--amber-bg:#FEF0C7;--amber:#7A2E0E;--lane-part:#FEC84B;--lane-part-ink:#4E2A06;--lane-done:#05603A;--lane-done-ink:#FFFFFF;--btn:#101828;--btn-ink:#FFFFFF;
  position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.ld[hidden]{display:none}
@media (prefers-color-scheme:dark){.ld{--bg:#0C111D;--surface:#161B26;--ink:#F5F5F6;--muted:#A4A9B3;--line:#232A38;--line2:#364152;--outline:#8A94A6;--red-bg:#4A1D1A;--red:#FDA29B;--blue-bg:#172554;--blue:#93C5FD;--green-bg:#0B3B2A;--green:#75E0A7;--amber-bg:#4A2F0B;--amber:#FEC84B;--lane-part:#B54708;--lane-part-ink:#FFFAEB;--lane-done:#17B26A;--lane-done-ink:#05140C;--btn:#F5F5F6;--btn-ink:#0C111D;color-scheme:dark}}
body.ld-lock{overflow:hidden}
.ld *{box-sizing:border-box}
.ld-wrap{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.ld-header{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 8px}
.ld-back{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
.ld-header h1{flex:1;min-width:0;font-size:19px;font-weight:700;margin:0;text-align:left;color:var(--ink)}
.ld-date{font-size:14px;font-weight:600;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;white-space:nowrap}
.ld-banner{margin:0 16px 10px;padding:10px 12px;border-radius:8px;border:2px solid var(--red);background:var(--red-bg);color:var(--red);font-weight:700;font-size:13px}
.ld-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 12px}
.ld-tile{font:inherit;text-align:left;border:2px solid transparent;border-radius:10px;padding:10px 12px;min-height:64px;cursor:pointer;color:inherit}
.ld-tile .ld-n{display:block;font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ld-tile .ld-l{display:block;font-size:12px;font-weight:600;margin-top:4px}
.ld-tile[data-k="attn"]{background:var(--red-bg);color:var(--red)}
.ld-tile[data-k="open"]{background:var(--blue-bg);color:var(--blue)}
.ld-tile[data-k="done"]{background:var(--green-bg);color:var(--green)}
.ld-tile[aria-pressed="true"]{border-color:currentColor}
.ld-plants{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ld-chip{flex:1 1 52px;font:inherit;font-size:14px;font-weight:600;min-height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer}
.ld-chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.ld-chip .ld-cnt{color:var(--red);font-weight:700}
.ld-chip[aria-pressed="true"] .ld-cnt{color:inherit}
.ld-sec{padding:14px 16px 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ld-sec.attn{color:var(--red)}.ld-sec.open{color:var(--blue)}.ld-sec.done{color:var(--green)}
.ld-row{border-bottom:1px solid var(--line)}
.ld-head{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ld-head:focus-visible,.ld-chip:focus-visible,.ld-tile:focus-visible,.ld-btn:focus-visible,.ld-back:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ld-id{flex:1;min-width:0;display:block}
.ld-top{display:flex;align-items:baseline;gap:8px}
.ld-unit{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:600}
.ld-plant{font-size:12px;color:var(--muted)}
.ld-note{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ld-pill{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:3px 8px;white-space:nowrap}
.ld-pill.red{background:var(--red-bg);color:var(--red)}.ld-pill.amber{background:var(--amber-bg);color:var(--amber)}
.ld-lanes{display:flex;gap:3px}
.ld-ln{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font:700 11px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--outline);color:var(--muted);background:var(--surface)}
.ld-ln.d{background:var(--lane-done);color:var(--lane-done-ink);border-color:var(--lane-done)}
.ld-ln.p{background:var(--lane-part);color:var(--lane-part-ink);border-color:var(--lane-part)}
.ld-chev{flex:none;width:14px;text-align:center;color:var(--outline);transition:transform .15s}
.ld-row[data-open="true"] .ld-chev{transform:rotate(180deg)}
.ld-more{padding:0 16px 14px}
.ld-more p{font-size:13px;color:var(--muted);margin:0 0 10px}
.ld-more .ld-part{color:var(--amber)}
.ld-btns{display:flex;gap:8px}
.ld-btn{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;padding:0 4px;border-radius:8px;border:1px solid var(--outline);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;background:var(--surface);cursor:pointer;font-family:inherit}
.ld-btn.main{flex:2;background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.ld-empty{padding:28px 16px;color:var(--muted);text-align:center}
.ld-empty.ld-err{color:var(--red);font-weight:700}
.ld-foot{padding:14px 16px 16px;font-size:12px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){.ld-chev{transition:none}}
</style>
</head>
<body>
<div id="photoBanner" class="photo-banner"></div>

<p class="home"><a href="index.html">← Main</a></p>
<h1>Gulf Stream PDI Capture</h1>

<div class="photo-chip" id="photoChip"></div>
<div class="queue-badge" id="queueBadge">Pending offline submits: 0 — tap to retry</div>
<div class="queue-actions" id="queueActions">
  <button type="button" id="btnRetryQueue" style="background:#2980b9;color:#fff">Retry queue</button>
  <button type="button" id="btnDropPhotos" style="background:#7f8c8d;color:#fff">Drop leftover photos</button>
</div>

<div class="card today-panel" id="todayCard">
  <div class="row">
    <div>
      <label>Review date</label>
      <input type="date" id="reviewDate">
    </div>
    <div style="display:flex;align-items:flex-end;padding-bottom:10px;">
      <button type="button" class="btn btn-save" id="btnToday" style="flex:1;">Load Day's Units</button>
    </div>
  </div>
  <p class="status" id="todayStatus" style="margin-top:4px;"></p>
</div>


<div class="card">
  <div class="row">
    <div>
      <label>Date</label>
      <input type="date" id="pdiDate">
    </div>
    <div>
      <label>Unit # (numeric)</label>
      <input type="text" id="unitNumber" inputmode="numeric" pattern="[0-9]*" placeholder="Unit #">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Model #</label>
      <input type="text" id="modelNumber" placeholder="Model">
    </div>
    <div>
      <label>Inspector</label>
      <select id="inspectorSelect"></select>
      <input type="hidden" id="inspectorName">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Plant</label>
      <select id="plantSelect">
        <option value="">— Select Plant —</option>
        <option value="51">51</option>
        <option value="53">53</option>
        <option value="76">76</option>
        <option value="57">57 Etna Green</option>
      </select>
    </div>
    <div>
      <label>Unit Type</label>
      <select id="unitType">
        <option value="towable">Towable</option>
        <option value="motorized">Motorized</option>
      </select>
    </div>
  </div>
  <div class="row" id="toyHaulerRow" style="display:none">
    <div>
      <label>Toy Hauler</label>
      <select id="toyHaulerSelect">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>
    <div id="thWallCell" style="display:none">
      <label>Permanent wall of separation</label>
      <select id="thWallSelect">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>
  </div>
  <div id="toyHaulerNote" class="sub" style="display:none;text-align:left;color:#c0392b;font-weight:700;margin:-4px 0 10px"></div>
  <div class="row">
    <div>
      <label>Lane</label>
      <select id="laneSelect">
        <option value="">— Select Lane —</option>
        <option value="R">Rain, Seals, Roofs</option>
        <option value="S">Systems</option>
        <option value="E">Exterior + Underbelly</option>
        <option value="I">Interior</option>
        <option value="U">PDI Validation</option>
      </select>
      <div id="laneClock" class="sub" style="text-align:left;margin:6px 0 0;color:#1f4e79;font-weight:700"></div>
      <div id="clockWarn" class="sub" style="text-align:left;color:#c0392b;font-weight:700;display:none">Clock at 45m — stop or submit.</div>
      <button type="button" class="photo-btn" id="btnStopClock" style="display:none;margin-top:6px">Stop clock</button>
      <button type="button" class="photo-btn" id="btnResumeClock" style="display:none;margin-top:6px">Resume clock</button>
    </div>
  </div>
</div>

<div id="laneBox" class="card hidden"></div>



<div class="card" id="defSummaryCard">
  <h3 style="margin-bottom:6px;">Fails on this lane: <span id="defCount">0</span></h3>
  <p class="sub" style="margin:0 0 8px">Checklist fails stay under the red line. Use Add Defect only for something that is not on the sheet.</p>
  <div id="defectList"></div>
  <button type="button" class="btn-add" id="btnAdd">+ Add Defect</button>
</div>


<div class="card" id="draftsCard" style="display:none">

  function attachMic(ta, btn) {

      var next = new SR();

          var chunk = ev.results[i][0].transcript || "";

        ta.value = (base ? base.replace(/\s+$/, "") + " " : "") + (finalText + interim).replace(/^\s+/, "");
        ta.dispatchEvent(new Event("input"));

      next.onerror = function(ev) {

    // ---- Draft encryption (AES-GCM, at-rest on device) ----
  // Key is app-derived — stops casual localStorage reads / device forensics lite.

  var DRAFT_CRYPTO = {
    salt: "gs-pdi-gulfstream-2026-v1",

  function _bytesToB64(buf) {

        "raw", enc.encode(DRAFT_CRYPTO.salt + "|gulf-stream-pdi"),

        {
          name: "PBKDF2",

          iterations: DRAFT_CRYPTO.iterations,

      el("ldDate").textContent = dateLabel();
      el("ldTiles").innerHTML = ["attn", "open", "done"].map(function (k) {
        return '<button type="button" class="ld-tile" data-k="' + k + '" aria-pressed="' + (st.g === k) + '"><span class="ld-n">' + count(rows, k) + '</span><span class="ld-l">' + LBL[k] + "</span></button>";
      }).join("");
      var plants = PLANTS.slice();
      rows.forEach(function (m) { if (plants.indexOf(m.plant) < 0) plants.push(m.plant); });
      var h = '<button type="button" class="ld-chip" data-p="all" aria-pressed="' + (st.p === "all") + '">All</button>';
      plants.forEach(function (p) {
        var n = rows.filter(function (m) { return m.g === "attn" && m.plant === p; }).length;
        h += '<button type="button" class="ld-chip" data-p="' + x(p) + '" aria-pressed="' + (st.p === p) + '">' + x(p) + (n ? ' <b class="ld-cnt">' + n + "</b>" : "") + "</button>";
      });
      el("ldPlants").innerHTML = h;
      el("ldBanner").innerHTML = st.banners.map(function (b) { return '<div class="ld-banner" id="scanBanner">' + x(b) + "</div>"; }).join("");
      var list = el("ldList"), sec = el("ldSec");
      if (st.loading && !rows.length) { sec.textContent = ""; list.innerHTML = '<div class="ld-empty" id="ldLoading">Loading…</div>'; return; }
      if (st.error && !rows.length) { sec.textContent = ""; list.innerHTML = '<div class="ld-empty ld-err">' + x(st.error) + '</div>'; return; }
      var shown = sorted(rows.filter(function (m) { return m.g === st.g && (st.p === "all" || m.plant === st.p); }), st.g);
      sec.className = "ld-sec " + st.g;
      sec.textContent = TITLES[st.g] + " · " + shown.length + (st.loading ? " · loading more…" : "");
      if (!shown.length) {
        list.innerHTML = '<div class="ld-empty" data-empty="1">' + (st.p === "all" ? "Nothing in " + LBL[st.g].toLowerCase() + " for " + x(dateLabel()) + "." : "Nothing here for Plant " + x(st.p) + ".") + "</div>";
        return;
      }
      list.innerHTML = shown.map(function (m) {
        var open = st.open === m.unit;
        var sq = m.lanes.map(function (l) { return '<span class="ld-ln ' + l.s + '" data-lane="' + x(l.k) + '" data-state="' + l.s + '" title="' + x(l.lab) + '" aria-label="' + x(l.lab) + '">' + x(l.k) + "</span>"; }).join("");
        var pill = m.pill ? '<span class="ld-pill ' + m.pill[0] + '">' + x(m.pill[1]) + "</span>" : "";
        return '<div class="ld-row" data-unit="' + x(m.unit) + '" data-g="' + m.g + '" data-g0="' + m.g0 + '" data-plant="' + x(m.plant) + '" data-red="' + m.red + '" data-open="' + open + '">' +
          '<button type="button" class="ld-head" data-u="' + x(m.unit) + '" aria-expanded="' + open + '">' +
          '<span class="ld-id"><span class="ld-top"><span class="ld-unit">' + x(m.unit) + '</span><span class="ld-plant">Plant ' + x(m.plant) + '</span></span><span class="ld-note">' + x(m.note) + "</span></span>" +
          '<span class="ld-side">' + pill + '<span class="ld-lanes">' + sq + "</span></span><span class=\"ld-chev\" aria-hidden=\"true\">&#8964;</span></button>" +
          (open ? '<div class="ld-more"><p class="ld-last">' + x(m.more) + "</p>" + (m.partial.length ? '<p class="ld-part">' + m.partial.map(x).join("<br>") + "</p>" : "") +
            '<div class="ld-btns"><button type="button" class="ld-btn main" data-use="' + x(m.unit) + '">Use this unit</button>' +
            '<a class="ld-btn" href="aggregator.html?unit=' + encodeURIComponent(m.unit) + '" target="_blank" rel="noopener">View</a>' +
            '<a class="ld-btn" href="traveler.html?unit=' + encodeURIComponent(m.unit) + '" target="_blank" rel="noopener">Traveler</a></div></div>' : "") + "</div>";
      }).join("");
      var key = [];
      var any = function (f) { return rows.some(f); };
      key.push("R Rain · S Systems · E Exterior · I Interior");
      if (any(function (m) { return m.hasU; })) key.push("U Validation");
      if (any(function (m) { return m.legacy; })) key.push("1–4 old sheet");
      el("ldKey").textContent = key.join(" · ");
    }
    function show() {
      var s = root(); if (!s) return;
      s.hidden = false; document.body.classList.add("ld-lock");
      var b = el("ldBack"); if (b) b.focus();
    }
    function hide() {
      var s = root(); if (!s) return;
      s.hidden = true; document.body.classList.remove("ld-lock");
      var b = el("btnToday"); if (b && b.focus) b.focus();
    }
    function init() {
      var s = root(); if (!s) return;
      s.addEventListener("click", function (e) {
        var t = e.target.closest(".ld-tile"), c = e.target.closest(".ld-chip"), h = e.target.closest(".ld-head"), u = e.target.closest("[data-use]"), b = e.target.closest("#ldBack");
        if (b) { hide(); return; }
        if (u) {
          var unit = u.getAttribute("data-use");
          el("unitNumber").value = unit;
          setStatus("Unit " + unit + " loaded into form");
          hide(); window.scrollTo(0, 0); return;
        }
        if (t) { st.g = t.getAttribute("data-k"); st.open = null; paint(); return; }
        if (c) { st.p = c.getAttribute("data-p"); st.open = null; paint(); return; }
        if (h) { var id = h.getAttribute("data-u"); st.open = (st.open === id ? null : id); paint(); }
      });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !s.hidden) hide(); });
    }
    return { st: st, show: show, hide: hide, paint: paint, init: init };
  })();

  async function loadTodayUnits() {
    var dateEl = el("reviewDate");
    var date = dateEl ? dateEl.value : "";
    if (!date) { setStatus("Pick a review date first"); var ts0 = el("todayStatus"); if (ts0) ts0.textContent = "Pick a date"; return; }
    var st = el("todayStatus");
    if (st) st.textContent = "Loading today…";
    LD.st.date = date; LD.st.units = []; LD.st.banners = []; LD.st.loading = true; LD.st.error = ""; LD.st.open = null;
    LD.show(); LD.paint();
    await lockBtn("btnToday", "Loading…");
    try {
      var banners = [];
      async function fetchScope(scope) {
        var res = await fetch(API_BASE + "/day-units?date=" + encodeURIComponent(date) + "&scope=" + scope);
        var raw = await res.text();
        var data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch (e) {
          throw new Error(scope + " board timed out (HTTP " + res.status + ")");
        }
        if (!res.ok) throw new Error(data.error || ("HTTP " + res.status + (res.status === 502 ? " — function timed out, retry" : "")));
        if (data && data.scan && data.scan.banner) banners.push(data.scan.banner);
        return data.units || [];
      }
      var todayUnits = await fetchScope("today");
      LD.st.units = todayUnits.slice(); LD.st.banners = banners.slice(); LD.paint();
      if (st) st.textContent = date + " · " + todayUnits.length + " today — loading leftovers…";
      var carryUnits = [];
      try { carryUnits = await fetchScope("carry"); }
      catch (e2) { if (st) st.textContent = date + " · today loaded · leftovers failed (" + (e2.message||e2) + ")"; LD.st.error = "Leftovers failed: " + (e2.message || e2); }
      var units = todayUnits.concat(carryUnits);
      LD.st.units = units; LD.st.banners = banners.slice(); LD.st.loading = false; LD.paint();
      if (!units.length) {
        if (st) st.textContent = "No units indexed for " + date + (banners.length ? " · " + banners.join(" ") : "");
        return;
      }
      var cnt = { carry: 0, open: 0, await: 0, cleared: 0 };
      units.forEach(function (u) { var g = (function () { var r = u && u.rpt; if (r && r.bucket === "rain-queue") return "await"; if (u.bucket === "carryover") return "carry"; if (u.bucket === "today-open") return "open"; if (u.bucket === "today-cleared") return "cleared"; return ""; })(); if (g) cnt[g]++; });
      if (st && !LD.st.error) st.textContent = date + " · " + cnt.carry + " in PDI (leftover) · " + cnt.open + " open today · " + cnt.cleared + " cleared today · " + cnt.await + " awaiting PDI";
    } catch (err) {
      LD.st.loading = false; LD.st.error = "Failed: " + (err.message || err); LD.paint();
      if (st) st.textContent = "Failed: " + (err.message || err);
    } finally {
      LD.st.loading = false;
      unlockBtn("btnToday");
    }
  }
  LD.init();
  if (el("btnToday")) el("btnToday").onclick = loadTodayUnits;
  initReviewDate();

  setStatus("Ready — exact form checklists loaded");
})();
</script>
<script>requireFloor();</script>
</body>
